name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://qwcigjclpxnwtfjhjqgr.supabase.co/rest/v1/children?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Response: $CODE"
          if [ "$CODE" -ge 500 ]; then exit 1; fi
